name: ci

# Secret-free validation. This workflow must not read repository credentials.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: newwords-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.23.4"

      - name: Test reports and publish planner
        working-directory: newwords
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -v
          python3 push_report.py --all --dry-run

      - name: Check Worker bundle
        working-directory: newwords/worker
        env:
          CI: "true"
          FORCE_COLOR: "0"
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_SEND_ERROR_REPORTS: "false"
        run: |
          set -euo pipefail
          npm ci
          node --check src/index.js
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/newwords-dry-run"
