name: publish

# Production publish for the existing newwords Worker and KV reports.
# Do not add a PR event. Untrusted PR code must not run with the production token.
# Repository secrets are still visible to workflows pushed by people with write access.
# Keep write access limited. See newwords/README.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newwords-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Echo668899/find-new-wrods' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.23.4"

      - name: Test reports and publish planner
        working-directory: newwords
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -v
          python3 push_report.py --all --dry-run

      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is missing"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is set"

      - name: Deploy Worker
        working-directory: newwords/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CI: "true"
          FORCE_COLOR: "0"
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_SEND_ERROR_REPORTS: "false"
        run: |
          set -euo pipefail
          npm ci
          npx wrangler deploy --keep-vars

      - name: Publish reports
        working-directory: newwords
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 push_report.py --all
